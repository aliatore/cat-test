name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # La misma version que fija .fvmrc
  FLUTTER_VERSION: 3.41.9

jobs:
  checks:
    name: Formato, analisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Codigo generado al dia
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code -- lib

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver

      - run: flutter analyze

      - run: flutter test --coverage

  android:
    name: APK de release
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nekodex-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: Build de iOS (sin firma)
    needs: checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter build ios --release --no-codesign
