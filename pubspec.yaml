name: cat_directory_app
description: "Directorio de razas de gatos - prueba tecnica Nextep"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # estado
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.2

  # navegacion
  go_router: ^17.5.0

  # datos
  dio: ^5.11.1
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  connectivity_plus: ^7.3.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # infraestructura
  get_it: ^9.3.0
  intl: ^0.20.2

  # experiencia
  lottie: ^3.6.1
  flutter_animate: ^4.5.2
  audioplayers: ^6.7.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1

  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
