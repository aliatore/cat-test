include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/gen/**
  errors:
    # freezed + json_serializable usan @JsonKey sobre parametros del constructor
    invalid_annotation_target: ignore

linter:
  rules:
    public_member_api_docs: false
    # los contratos de una sola operacion existen para poder cambiarlos en tests
    one_member_abstracts: false
    sort_pub_dependencies: false
